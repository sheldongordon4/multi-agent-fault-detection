[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
