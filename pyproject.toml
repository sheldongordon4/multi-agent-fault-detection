[project]
name = "mafd"
version = "0.1.0"
description = "Multi-Agent Fault Detection — detection, classification and diagnosis for distribution feeders"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",

    # Persistence
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-ulid>=2.0",

    # Event bus
    "confluent-kafka>=2.3",

    # ML / DSP
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    # Declared explicitly, though sentence-transformers would pull it anyway, so
    # that [tool.uv.sources] below can pin it to the CPU wheel index.
    "torch>=2.0",

    # Coordinator + RAG
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-huggingface>=0.1",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "tiktoken>=0.7",
    "sentence-transformers>=3.0",

    "requests>=2.31",
]

[dependency-groups]
# Installed by `uv sync` (the default) and by `uv sync --group dev`; excluded by
# `uv sync --no-dev`, which is what the runtime image uses.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.uv]
# The repo is an application, not a distributable package: `app` is imported
# from the repo root rather than installed. Without this, `uv sync` would try to
# build and install the project itself and fail for want of a build backend.
package = false

# CPU-only torch. This replaces the two-step pip dance the Dockerfiles used to
# do (install torch from the CPU index, then everything else) — the default CUDA
# build is ~2 GB larger and nothing here uses a GPU.
#
# `explicit = true` means the index is consulted ONLY for packages that name it
# below, so nothing else silently resolves against it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Linux and Windows only: macOS wheels on PyPI are already CPU-only, and the
# pytorch CPU index has no macOS wheels at all, so pointing mac at it would make
# the lock unresolvable there.
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["backend", "ml", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

# Bare `pytest` does NOT put the rootdir on sys.path, and [tool.uv] package =
# false means backend/ and ml/ are never installed into the venv. Together that
# made `uv run pytest` (what CI runs) fail to import them while
# `python -m pytest` succeeded: 26 tests collected with 10 collection errors
# instead of 101. This puts the rootdir on the path for every invocation.
pythonpath = ["."]
